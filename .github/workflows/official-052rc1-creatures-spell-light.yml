name: Official OpenMW 0.52 RC1 with creature ragdolls and colored magic bolts

on:
  push:
    branches:
      - official-052rc1-creatures-spell-light
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Windows:
    name: Windows EXE - official RC1 + creature ragdolls + colored spell lighting
    uses: ./.github/workflows/windows.yml
    with:
      image: "2022"
      msvc: "2022"
      build-type: "RelWithDebInfo"
      package: false
      merge-official-rc1: true
