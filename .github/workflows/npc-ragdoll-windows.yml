name: NPC ragdoll Windows build

on:
  push:
    branches:
      - npc-ragdoll-stable-build
      - flying-creatures-slowfall-bones
      - flying-creatures-fall-2-5x
      - flying-creatures-fall-5x
      - flying-creatures-fall-10x
      - npc-blade-dismemberment-physics
      - npc-all-deaths-ragdoll-stronger-kick
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Windows:
    uses: ./.github/workflows/windows.yml
    with:
      image: "2022"
      msvc: "2022"
      build-type: "RelWithDebInfo"
      package: false
