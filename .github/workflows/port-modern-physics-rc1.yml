name: Integrate Modern Physics v1.1 into RC1
on:
  push:
    branches:
      - openmw-052-rc1-modern-physics-v11
    paths:
      - .github/workflows/port-modern-physics-rc1.yml
jobs:
  integrate:
    if: contains(github.event.head_commit.message, '[port-merge]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Merge Modern Physics v1.1 into OpenMW 0.52.0 RC1
        shell: bash
        run: |
          set -e
          git fetch origin modern-physics-v11-port-source
          git config user.name "OpenMW RC1 port"
          git config user.email "openmw-rc1-port@users.noreply.github.com"
          git merge --no-ff -X theirs -m "Port complete Modern Physics v1.1 onto official OpenMW 0.52.0 RC1" FETCH_HEAD
          git status --short
          git push origin HEAD:refs/heads/openmw-052-rc1-modern-physics-v11
